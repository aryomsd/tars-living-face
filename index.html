<style>

details{border:1px solid #24444c;border-radius:8px;margin-top:12px;padding:10px}summary{cursor:pointer;letter-spacing:2px;font-weight:700;padding:8px}#telemetry{position:absolute;inset:12px;z-index:1;pointer-events:none;color:#315e67;opacity:.6;font-size:10px;white-space:pre-wrap;overflow:hidden;line-height:1.6} .screen:after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.09) 3px 4px)} </style></head><body><main><header><div><h1>TARS_</h1><small>EXPRESSIVE KINEMATICS · P03-R2.6</small></div><div id="mood">OBSERVING</div></header><div class="screen" id="stage"><div id="telemetry" aria-hidden="true"></div><canvas id="scene" width="1020" height="600"></canvas></div><nav style="margin:8px 0"><span id="status">Touch, drag, flick, or provoke TARS.</span><button id="sound">AUDIO ON</button></nav><div class="actions"><button data-act="GREET">GREET</button><button data-act="JOKE">JOKE</button><button data-act="MISSION">MISSION</button><button data-act="SCAN">SCAN</button><button data-act="PROVOKE">PROVOKE</button><button data-act="COMPLIMENT">COMPLIMENT</button><button data-act="RESET">RESET</button></div><details><summary>⚙ SETTINGS / TELEMETRY</summary><section><label><span>HONESTY</span><input data-setting="honesty" type="range" min="0" max="100" value="90"></label><label><span>HUMOR</span><input data-setting="humor" type="range" min="0" max="100" value="75"></label><label><span>SARCASM</span><input data-setting="sarcasm" type="range" min="0" max="100" value="65"></label><label><span>VOLUME</span><input data-setting="volume" type="range" min="0" max="100" value="100"></label><div id="log"></div></section></details><p><small>Experimental mobile adaptation · R2.4 baseline remains locked · <a href="https://github.com/aryomsd/tars-living-face">Source</a></small></p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('scene'),g=canvas.getContext('2d'),stage=document.getElementById('stage');if(!g)return;
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)],time=()=>performance.now();
const face={x:510,y:260,vx:0,vy:0},neck={x:510,y:260,vx:0,vy:0},inner={x:510,y:260,vx:0,vy:0},outer={x:510,y:260,vx:0,vy:0};
let gaze={x:510,y:260},target={x:510,y:260},drag=false,old={x:0,y:0,t:0},fling={x:0,y:0},shake=0,dizzy=0,anger=0,wobble=0,engagement=0,excitement=0,irritation=0,lastTouch=0,interactionStart=0,lastSfx=0,lastPrompt=0,audioCtx=null,mood='neutral',expression='neutral',exprEnd=0,refuse=0,blink=0,blinkEnd=0,last=time(),route=[],routeI=0,routeT=0,routeMs=800,routeMood='normal',nextWander=time()+1000,rings=[{a:0,v:0,goal:0,next:0,mode:'stop'},{a:1,v:0,goal:0,next:0,mode:'stop'}],eye=[{x:-35,y:0,w:56,h:65,tilt:0},{x:35,y:0,w:54,h:62,tilt:0}],sound=true,synth=window.speechSynthesis,settings={honesty:90,humor:75,sarcasm:65,volume:100};
function point(p,x,y,f,d,dt){let w=TAU*f;p.vx=clamp(p.vx+(w*w*(x-p.x)-2*d*w*p.vx)*dt,-2500,2500);p.vy=clamp(p.vy+(w*w*(y-p.y)-2*d*w*p.vy)*dt,-2500,2500);p.x+=p.vx*dt;p.y+=p.vy*dt}
function audioReady(){if(!sound)return null;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(_){return null}}
function fx(type,force=false){let t=time();if(!sound||(!force&&t-lastSfx<650))return;let a=audioReady();if(!a)return;lastSfx=t;let osc=a.createOscillator(),gain=a.createGain(),now=a.currentTime;

function prompt(msg){let t=time();if(t-lastPrompt<1200)return;lastPrompt=t;let el=document.getElementById('telemetry');el.textContent=('> '+msg+'\n'+el.textContent).slice(0,1400);if(Math.random()<.35)fx('process')}
function speech(txt){if(sound&&synth){synth.cancel();let s=new SpeechSynthesisUtterance(txt);s.volume=settings.volume/100;s.rate=mood==='angry'?1.15:.92;synth.speak(s)}}
function log(txt){document.getElementById('status').textContent=txt;let d=document.getElementById('log');d.textContent='> '+txt+'\n'+d.textContent.slice(0,450);speech(txt)}
function show(exp,ms=2800){expression=exp;exprEnd=time()+ms;document.getElementById('mood').textContent=exp.toUpperCase()}
function curve(a,b,c,d,u){let v=1-u;return{x:v*v*v*a.x+3*v*v*u*b.x+3*v*u*u*c.x+u*u*u*d.x,y:v*v*v*a.y+3*v*v*u*b.y+3*v*u*u*c.y+u*u*u*d.y}}
function plan(x,y,force=false,style){if(time()<refuse&&!force)return;let a={x:target.x,y:target.y},b={x:clamp(x,80,940),y:clamp(y,65,535)},dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),nx=-dy/(d||1),ny=dx/(d||1);let kind=style||pick(d>200?['curve','turns','slingshot','curve']:['curve','curve','turns']),nodes=[a];if(kind==='slingshot')nodes.push({x:clamp(a.x-dx*.33,75,945),y:clamp(a.y-dy*.33,65,535)});if(kind==='turns'){let n=pick([3,4]);for(let j=1;j<n;j++){let m=(j%2?1:-1)*rand(45,115);nodes.push({x:clamp(a.x+dx*j/n+nx*m,75,945),y:clamp(a.y+dy*j/n+ny*m,65,535)})}}nodes.push(b);route=[];for(let j=0;j<nodes.length-1;j++){let p=nodes[j],q=nodes[j+1],ox=q.x-p.x,oy=q.y-p.y,bend=kind==='curve'?rand(-.3,.3):rand(-.1,.1);route.push([p,{x:p.x+ox*.3-oy*bend,y:p.y+oy*.3+ox*bend},{x:p.x+ox*.7-oy*bend,y:p.y+oy*.7+ox*bend},q])}routeI=0;routeT=time();routeMood=pick(mood==='angry'?['fast','snappy']:mood==='sleepy'?['sleepy','lazy']:['lazy','normal','active','fast','snappy','sluggish']);routeMs=({sleepy:2100,sluggish:1400,lazy:1050,normal:680,active:390,fast:250,snappy:170})[routeMood]/Math.max(1,route.length*.68);nextWander=time()+routeMs*route.length+rand(1600,3500)}
function react(type){audioReady();fx(type==='PROVOKE'?'annoy':type==='SCAN'?'scan':'greet',true);prompt('COMMAND '+type+' / PROCESSING');if(type==='RESET'){anger=shake=dizzy=wobble=0;refuse=0;mood='neutral';show('happy');log('Reset complete.');plan(510,260,true,'curve');return}if(type==='PROVOKE'){mood='angry';irritation=clamp(irritation+.13,0,1);anger=clamp(anger+.12,0,1);wobble=1;show('angry',3800);log(anger>.7?'STOP. THAT. RIGHT. NOW!':'You are testing my patience.');if(irritation>.83)refuse=time()+1000;plan(rand(120,900),rand(110,500),true,'turns');return}if(type==='COMPLIMENT'){anger*=.2;mood='happy';refuse=0;show('glee');log('Oh. You noticed!');return}if(type==='GREET'){mood='happy';show(pick(['happy','glee','surprised']));log('Hello, human.');return}if(type==='JOKE'){mood='happy';show('glee');log('I find you statistically entertaining.');return}if(type==='MISSION'){mood='thinking';show('suspicious');log('Mission parameters unclear.');plan(rand(250,770),rand(170,410),true,'curve');return}if(type==='SCAN'){mood='thinking';show('surprised');log('Scanning. Try to look interesting.');plan(rand(250,770),rand(170,410),true,'turns')}}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>react(b.dataset.act));document.querySelectorAll('[data-setting]').forEach(s=>s.oninput=()=>settings[s.dataset.setting]=+s.value);

function coords(e){let b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*1020/b.width,y:(e.clientY-b.top)*600/b.height}}
stage.onpointerdown=e=>{audioReady();let p=coords(e);interactionStart=time();lastTouch=time();engagement=clamp(engagement+.025,0,1);fx(irritation>.65?'annoy':'touch');prompt('TACTILE CONTACT / RECOGNIZED');gaze=p;drag=Math.hypot(p.x-face.x,p.y-face.y)<160;old={...p,t:time()};shake=0;try{stage.setPointerCapture(e.pointerId)}catch(_){}if(!drag){show('surprised',1200);plan(p.x,p.y,false,'curve')}};
stage.onpointermove=e=>{let p=coords(e);gaze=p;if(drag){let dt=Math.max(.012,(time()-old.t)/1000);fling={x:clamp((p.x-old.x)/dt,-2400,2400),y:clamp((p.y-old.y)/dt,-2400,2400)};engagement=clamp(engagement+dt*.12,0,1);excitement=clamp(excitement+dt*.07,0,1);if(time()-interactionStart>5500)irritation=clamp(irritation+dt*.045,0,1);shake+=Math.max(0,Math.hypot(fling.x,fling.y)-1250)*.00007;target=p;old={...p,t:time()};if(shake>25&&time()-interactionStart>8500){dizzy=clamp(dizzy+.1,0,1);wobble=.5;show('dizzy',1200);irritation=clamp(irritation+.025,0,1);fx('rumble')}if(irritation>.88&&time()-interactionStart>10000){anger=clamp(anger+.02,0,1);refuse=time()+rand(350,1000)}}else if(time()>refuse){let level=irritation; if(level>.65){if(Math.random()<.65)plan(face.x+(face.x-p.x)*.8,face.y+(face.y-p.y)*.8,true,'slingshot');else plan(p.x,p.y,true,'turns');show('suspicious',900);fx('annoy')}else{let speed=excitement>.4?1:.83;plan(face.x+(p.x-face.x)*speed,face.y+(p.y-face.y)*speed,true,excitement>.5?'slingshot':'curve');if(Math.random()<.25){show(excitement>.35?'glee':'surprised',650);fx(excitement>.35?'giggle':'touch')}}nextWander=time()+rand(excitement>.4?120:230,excitement>.4?330:480)}};
function release(){if(!drag)return;drag=false;lastTouch=time();prompt('CONTACT RELEASED / REASSESSING');face.vx+=fling.x*.06;face.vy+=fling.y*.06;plan(clamp(face.x+fling.x*.1,110,910),clamp(face.y+fling.y*.1,100,500),true,Math.hypot(fling.x,fling.y)>750?'slingshot':'curve')}stage.onpointerup=release;stage.onpointercancel=release;
function rounded(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function drawEye(i,t){let e=eye[i],sg=i===0?-1:1,w=e.w,h=Math.max(2,e.h);g.save();g.translate(face.x+e.x+anger*rand(-3,3),face.y+e.y+anger*rand(-3,3));g.rotate(e.tilt);g.shadowColor='#57f4fa';g.shadowBlur=23;g.fillStyle='#4be8f0';
if(expression==='happy'||expression==='glee'){let arc=expression==='glee'?.26:.15;g.beginPath();g.moveTo(-w/2,-h*.18);g.quadraticCurveTo(0,-h*(.25+arc),w/2,-h*.18);g.lineTo(w/2,h*.3);g.quadraticCurveTo(0,h*(.65+arc),-w/2,h*.3);g.closePath()}
else if(expression==='angry'){g.beginPath();g.moveTo(-w/2,-h*(i===0?.1:.46));g.lineTo(w/2,-h*(i===0?.46:.1));g.lineTo(w/2,h/2);g.lineTo(-w/2,h/2);g.closePath()}
else{rounded(-w/2,-h/2,w,h,9)}g.fill();g.shadowBlur=0;
g.save();g.clip();g.fillStyle='rgba(255,255,255,.65)';rounded(-w*.3,-h*.35,w*.54,Math.max(2,h*.08),2);g.fill();
if(dizzy>.16){g.strokeStyle='rgba(1,31,39,.8)';g.lineWidth=2.8;g.beginPath();for(let n=0;n<90;n++){let a=n*.24+t*.009*(i===0?1:-1),r=n/90*Math.min(w,h)*.43;if(n===0)g.moveTo(Math.cos(a)*r,Math.sin(a)*r);else g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.stroke()}g.restore();g.restore()}
function update(t){let dt=clamp((t-last)/1000,.001,.022);last=t;if(!drag&&routeI<route.length){let u=(t-routeT)/routeMs;if(u>=1){routeI++;routeT=t;u=0}if(routeI<route.length){let ease=routeMood==='snappy'?1-(1-u)**4:routeMood==='sleepy'?u*u*(3-2*u):u*u*(3-2*u);target=curve(route[routeI][0],route[routeI][1],route[routeI][2],route[routeI][3],ease)}}else if(!drag&&t>nextWander){plan(rand(240,780),rand(150,420),false);nextWander=t+rand(2300,5500)}
const hz=drag?7:({sleepy:1.4,sluggish:1.9,lazy:2.7,normal:4.5,active:6.5,fast:8.5,snappy:10.5})[routeMood];for(let k=0;k<3;k++){let h=dt/3;point(face,clamp(target.x,55,965),clamp(target.y,60,540),hz,.82,h);let speed=Math.hypot(face.vx,face.vy),energy=clamp(speed/1700,0,1);point(neck,face.x-clamp(face.vx*.042,-69,69),face.y-clamp(face.vy*.038,-56,56),2.35,.68,h);point(inner,neck.x-energy*8,neck.y-energy*4,5,.78,h);point(outer,neck.x+energy*12-clamp(neck.vx*.038,-25,25),neck.y+energy*7-clamp(neck.vy*.038,-20,20),1.65,.52,h);let separation=Math.hypot(outer.x-inner.x,outer.y-inner.y),max=17+energy*52;if(separation>max){outer.x=inner.x+(outer.x-inner.x)*max/separation;outer.y=inner.y+(outer.y-inner.y)*max/separation;outer.vx*=.86;outer.vy*=.86}}
let lx=clamp((gaze.x-face.x)/350,-1,1),ly=clamp((gaze.y-face.y)/260,-1,1);
for(let i=0;i<2;i++){let e=eye[i],sg=i===0?-1:1,depth=1-sg*lx*.16;let height=expression==='sleepy'?0.25:expression==='glee'?0.69:expression==='happy'?0.77:expression==='angry'?0.83:expression==='suspicious'?(i===0?0.67:0.93):expression==='surprised'?1.22:1; if(t<blinkEnd)height=.035;e.x+=(sg*(35-Math.abs(lx)*(sg*lx<0?7:2))+lx*12-e.x)*Math.min(1,dt*12);e.y+=(ly*10-e.y)*Math.min(1,dt*12);e.w+=(55*depth-e.w)*Math.min(1,dt*13);e.h+=(64*height*depth-e.h)*Math.min(1,dt*14);e.tilt+=(clamp(face.vx/3300,-.12,.12)+sg*lx*.07+wobble*Math.sin(t*.025+i)*.09-e.tilt)*Math.min(1,dt*9)}
if(t>blink){blinkEnd=t+105;blink=t+rand(1800,6000);if(Math.random()<.28)fx('blink')}if(t>exprEnd&&expression!=='neutral')show(mood==='angry'&&anger>.35?'angry':'neutral',rand(2200,4000));
for(let j=0;j<2;j++){let r=rings[j];if(t>r.next){r.mode=pick(mood==='angry'?['burst','stutter','reverse','stop']:['stop','slow','drift','burst','stutter','reverse']);let s=Math.random()<.5?-1:1;r.goal=r.mode==='stop'?0:r.mode==='slow'?s*rand(.004,.04):r.mode==='drift'?s*rand(.08,.38):r.mode==='burst'?s*rand(4,8):s*rand(1,3);r.next=t+(r.mode==='slow'?rand(2000,4500):rand(500,2300))}let goal=r.mode==='stutter'&&Math.sin(t*.034+j)>.1?0:r.mode==='reverse'?Math.abs(r.goal)*(Math.sin(t*.01+j)>0?1:-1):r.goal;r.v+=(goal-r.v)*Math.min(1,dt*3.5);r.a+=r.v*dt}
let resting=!drag&&t-lastTouch>1200; if(resting){engagement=Math.max(0,engagement-dt*.025);excitement=Math.max(0,excitement-dt*.04);irritation=Math.max(0,irritation-dt*.075);if(irritation>.15&&Math.random()<dt*.2){show('sleepy',1400);fx('rumble')}else if(irritation>.05&&Math.random()<dt*.12)show('suspicious',900)}
if(drag&&t-interactionStart>2500){excitement=clamp(excitement+dt*.045,0,1);if(excitement>.3&&Math.random()<dt*.5)fx('giggle')}

anger=Math.max(0,anger-dt*.12);shake*=Math.exp(-dt*.85);dizzy*=Math.exp(-dt*.42);wobble*=Math.exp(-dt*.9);
if(t-lastPrompt>3500&&Math.random()<dt*.2)prompt('BACKGROUND TASK / '+(mood==='angry'?'COOLING':mood==='happy'?'PLAYFUL':'OBSERVING'));
g.fillStyle='#061013';g.fillRect(0,0,1020,600);g.strokeStyle='#183e44';g.lineWidth=1;for(let x=0;x<1020;x+=34){g.beginPath();g.moveTo(x,0);g.lineTo(x,600);g.stroke()}for(let y=0;y<600;y+=34){g.beginPath();g.moveTo(0,y);g.lineTo(1020,y);g.stroke()}
g.font='13px monospace';g.fillStyle='#3f6972';g.fillText('> TARS.EXE / LIVE',31,42);g.fillText('> KINEMATICS '+routeMood.toUpperCase(),31,60);
[inner,outer].forEach((p,j)=>{let r=j===0?108:145;g.beginPath();g.arc(p.x,p.y,r,rings[j].a,rings[j].a+(j===0?4.5:5.15));g.lineWidth=j===0?3:2;g.strokeStyle=j===0?'#8be3e7':'#4a8f9a';g.stroke();if(j===1){for(let k=0;k<26;k++){let a=rings[j].a*.3+k*TAU/26;g.beginPath();g.moveTo(p.x+Math.cos(a)*151,p.y+Math.sin(a)*151);g.lineTo(p.x+Math.cos(a)*(k%4===0?164:157),p.y+Math.sin(a)*(k%4===0?164:157));g.stroke()}}});
drawEye(0,t);drawEye(1,t);g.strokeStyle='#3f6d75';g.strokeRect(24,23,972,554);g.textAlign='center';g.fillStyle='#81b8be';g.fillText('TARS · P03-R2.6 · '+expression.toUpperCase(),510,560);g.textAlign='left';for(let y=1;y<600;y+=4){g.fillStyle='rgba(0,0,0,.13)';g.fillRect(0,y,1020,1)}if(document.body.contains(canvas))requestAnimationFrame(safeFrame)}
prompt('BOOT SEQUENCE / KINEMATICS READY');blink=time()+2500;
let frames=0;

requestAnimationFrame(safeFrame);
})();
</script></body></html>
