name: MORC audio library
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'   # daily 02:17 WIB — library grows by the day
  push:
    branches: [main]
    paths: ['cloudflare/**', '.github/workflows/morc-audio.yml']
permissions:
  contents: write
concurrency: morc-audio
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2a71697f8ca88cf88f05e85fef0cdbf8
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add repo secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "CLOUDFLARE_ACCOUNT_ID not set; wrangler will use the token's only account"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g wrangler@4
      - name: Bucket + Worker
        working-directory: cloudflare
        run: |
          wrangler r2 bucket create morc-audio || true
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::No workers.dev URL — enable your workers.dev subdomain in Cloudflare"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
      - name: Point MORC at the Worker
        run: |
          printf '{"worker":"%s"}\n' "$WORKER_URL" > audio/cloud.json
          if ! git diff --quiet -- audio/cloud.json || [ -n "$(git status --porcelain audio/cloud.json)" ]; then
            git config user.name "morc-bot"; git config user.email "morc-bot@users.noreply.github.com"
            git add audio/cloud.json && git commit -m "chore(audio): worker URL" && git push
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q faster-whisper==1.0.3 requests
      - name: Build clips (public domain -> Whisper -> 1-4 s mp3)
        run: python cloudflare/pipeline/build_clips.py --worker "$WORKER_URL" --out clips_out
      - name: Upload to R2
        run: |
          shopt -s nullglob
          for f in clips_out/*.mp3; do
            wrangler r2 object put "morc-audio/clips/$(basename "$f")" --file "$f" --content-type audio/mpeg --remote || echo "upload failed: $f"
          done
