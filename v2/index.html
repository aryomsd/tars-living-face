<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020c10">
<title>MORC v2.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="morc-app" data-morc="app">
  <header class="morc-head" data-morc="header">
    <h1 class="morc-logo"><b>MORC</b> <i>v2.0</i></h1>
    <img class="morc-dev" src="assets/akak-dev-works-logo.svg" alt="AKAK//DEV.WRKS" width="130" height="25">
  </header>

  <main class="morc-stage" data-morc="stage" aria-label="MORC character"></main>
  <p class="morc-subtitle" data-morc="subtitle" aria-live="polite"></p>

  <nav class="morc-controls" data-morc="controls">
    <button type="button" data-toggle="sfx" aria-pressed="true">SFX</button>
    <button type="button" data-toggle="voice" aria-pressed="true">VOICE</button>
    <button type="button" data-toggle="ai" aria-pressed="false" disabled title="Phase 6">AI</button>
    <button type="button" data-toggle="vfx" aria-pressed="true">VFX</button>
    <button type="button" data-toggle="id" aria-pressed="false" title="Indonesian lines">ID</button>
    <select data-control="body" aria-label="Body mode">
      <option value="target">TARGET</option>
      <option value="circle">CIRCLE</option>
      <option value="screen">SCREEN</option>
      <option value="eyes">EYES</option>
    </select>
    <label class="morc-size">SIZE <input type="range" data-control="size" min="0.5" max="1.6" step="0.05" value="1"></label>
    <button type="button" data-control="toy" disabled title="Phase 4">+ TOY</button>
  </nav>

  <footer class="morc-frame" data-morc="frame">
    <div class="morc-readouts" data-morc="readouts"></div>
    <div class="morc-stats" data-morc="stats"></div>
    <div class="morc-status" data-morc="status">BOOT…</div>
  </footer>

  <details class="morc-lab" data-morc="lab">
    <summary>MOTION LAB</summary>
    <label>EXAGGERATION <output data-out="exg">1.00</output>
      <input type="range" data-control="exg" min="0.5" max="2" step="0.05" value="1"></label>
    <label>EXPRESSION <select data-control="expr"></select></label>
    <div class="morc-gestures" data-morc="gestures"></div>
    <label>SAY <input type="text" data-control="say" maxlength="80" placeholder="Type a line, Enter"></label>
  </details>
</div>
<script type="module" src="src/ui/lab.js"></script>
</body>
</html>
